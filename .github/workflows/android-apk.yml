name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/lbank-futures-secure-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This repository currently contains Dart/Flutter sources but no
      # android/ platform scaffold. Generate the standard Android host project
      # in the runner so CI can compile an APK without committing generated
      # Gradle wrapper/binary files to the source repository.
      - name: Generate Android platform scaffold when missing
        shell: bash
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --org com.lbank.futures --project-name exm1 .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lbank-futures-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
